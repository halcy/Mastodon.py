        \u66B4\u529B\u5A92\u9AD4\u5FC5\u9808\u6A19\u793A\u70BA\u654F\u611F\u6216\u9644\
        \u5E36\u5167\u5BB9\u8B66\u793A\",\"hint\":\"\u9019\u5305\u62EC\u7279\u5225\
        \u6311\u91C1\u7684\u5167\u5BB9\uFF0C\u5373\u4F7F\u5B83\u53EF\u80FD\u6C92\u6709\
        \u986F\u793A\u7279\u5B9A\u7684\u8EAB\u9AD4\u90E8\u4F4D\uFF0C\u4EE5\u53CA\u5C4D\
        \u9AD4\u3001\u8840\u8165\u50B7\u5BB3\u548C\u5176\u4ED6\u8840\u8165\u5167\u5BB9\
        \u3002\u7279\u5225\u7325\u893B\u7684\u5167\u5BB9\u53EF\u80FD\u6703\u88AB\u5B8C\
        \u5168\u7981\u6B62\u3002\u500B\u4EBA\u6A94\u6848\u5716\u7247\u548C\u6A19\u984C\
        \u5716\u7247\u4E0D\u5F97\u5305\u542B\u8272\u60C5\u6216\u66B4\u529B\u5A92\u9AD4\
        \u3002\"}}},{\"id\":\"2\",\"text\":\"No racism, sexism, homophobia, transphobia,\
        \ ableism, xenophobia, or casteism.\",\"hint\":\"Transphobic behavior such\
        \ as intentional misgendering and deadnaming is strictly prohibited. Promotion\
        \ of \\\"conversion therapy\\\" is strictly prohibited. Criticism of governments\
        \ and religions is permissible unless being used as a proxy for discrimination.\"\
        ,\"translations\":{\"de\":{\"text\":\"Kein(e) Rassismus, Sexismus, Homophobie,\
        \ Transphobie, Behindertenfeindlichkeit, Fremdenfeindlichkeit oder Kasteismus.\"\
        ,\"hint\":\"Transphobes Verhalten wie die absichtliche Verwendung von falschen\
        \ Anreden und Pronomen sowie Deadnaming ist strengstens verboten. Die Werbung\
        \ f\xFCr Konversionstherapien ist strengstens verboten. Die Kritik an Regierungen\
        \ und Religionen ist zul\xE4ssig, sofern sie nicht stellvertretend f\xFCr\
        \ Diskriminierung verwendet wird.\"},\"es\":{\"text\":\"Prohibido el racismo,\
        \ sexismo, homofobia, transfobia, able\xEDsmo, xenofobia o casticismo.\",\"\
        hint\":\"Queda terminantemente prohibido el comportamiento transf\xF3bico,\
        \ como el uso intencionado de nombres falsos o el \\\"deadnaming\\\". La promoci\xF3\
        n de la \\\"terapia de conversi\xF3n\\\" est\xE1 estrictamente prohibida.\
        \ Se permiten las cr\xEDticas a gobiernos y religiones, a menos que se utilicen\
        \ como excusa para la discriminaci\xF3n.\"},\"fr\":{\"text\":\"Pas de racisme,\
        \ sexisme, homophobie, transphobie, validisme, x\xE9nophobie ou discrimination\
        \ de caste.\",\"hint\":\"Les comportements intentionnellement transphobes,\
        \ comme le m\xE9genrage ou le morinommage (\u201Cdeadnaming\u201D) est strictement\
        \ interdit. La promotion des \u201Cth\xE9rapies de conversion\u201D est strictement\
        \ interdite. La critique des gouvernements et religions est autoris\xE9e,\
        \ sauf dans les cas ou elle est utilis\xE9e comme paravent pour de la discrimination.\"\
        },\"nl\":{\"text\":\"Geen racisme, seksisme, homofobie, transfobie, validisme,\
        \ xenofobie of kastendiscriminatie.\",\"hint\":\"Transfobisch gedrag zoals\
        \ opzettelijk misgenderen en deadnaming is ten strengste verboden. Het promoten\
        \ van \u201Cconversie therapie\u201D is ten strengste verboden. Kritiek op\
        \ overheden en religies is toegestaan tenzij het wordt gebruikt als proxy\
        \ voor racisme.\"},\"ru\":{\"text\":\"\u0417\u0430\u043F\u0440\u0435\u0449\
        \u0430\u0435\u0442\u0441\u044F \u0440\u0430\u0441\u0438\u0437\u043C, \u0441\
        \u0435\u043A\u0441\u0438\u0437\u043C, \u0433\u043E\u043C\u043E\u0444\u043E\
        \u0431\u0438\u044F, \u0442\u0440\u0430\u043D\u0441\u0444\u043E\u0431\u0438\
        \u044F, \u044D\u0439\u0431\u043B\u0438\u0437\u043C, \u043A\u0441\u0435\u043D\
        \u043E\u0444\u043E\u0431\u0438\u044F \u0438 \u043A\u0430\u0441\u0442\u043E\
        \u0432\u043E\u0441\u0442\u044C.\",\"hint\":\"\u0422\u0440\u0430\u043D\u0441\
        \u0444\u043E\u0431\u043D\u043E\u0435 \u043F\u043E\u0432\u0435\u0434\u0435\u043D\
        \u0438\u0435, \u0442\u0430\u043A\u043E\u0435 \u043A\u0430\u043A \u043E\u0441\
        \u043E\u0437\u043D\u0430\u043D\u043D\u044B\u0439 \u043C\u0438\u0441\u0433\u0435\
        \u043D\u0434\u0435\u0440\u0438\u043D\u0433 \u0438 \u0434\u0435\u0434\u043D\
        \u0435\u0439\u043C\u0438\u043D\u0433, \u0441\u0442\u0440\u043E\u0433\u043E\
        \ \u0437\u0430\u043F\u0440\u0435\u0449\u0435\u043D\u043E. \u041F\u0440\u043E\
        \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \\\"\u043A\u043E\u043D\u0432\
        \u0435\u0440\u0441\u0438\u043E\u043D\u043D\u043E\u0439 \u0442\u0435\u0440\u0430\
        \u043F\u0438\u0438\\\" \u0441\u0442\u0440\u043E\u0433\u043E \u0437\u0430\u043F\
        \u0440\u0435\u0449\u0435\u043D\u043E. \u041A\u0440\u0438\u0442\u0438\u043A\
        \u0430 \u043F\u0440\u0430\u0432\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\
        \ \u0438 \u0440\u0435\u043B\u0438\u0433\u0438\u0439 \u0440\u0430\u0437\u0440\
        \u0435\u0448\u0435\u043D\u0430, \u043A\u0440\u043E\u043C\u0435 \u0441\u043B\
        \u0443\u0447\u0430\u0435\u0432, \u043A\u043E\u0433\u0434\u0430 \u043E\u043D\
        \u0430 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0441\u044F\
        \ \u043A\u0430\u043A \u043E\u043F\u0440\u0430\u0432\u0434\u0430\u043D\u0438\
        \u0435 \u0434\u043B\u044F \u0434\u0438\u0441\u043A\u0440\u0438\u043C\u0438\
        \u043D\u0430\u0446\u0438\u0438.\"},\"zh-CN\":{\"text\":\"\u7981\u6B62\u79CD\
        \u65CF\u4E3B\u4E49\u3001\u6027\u522B\u6B67\u89C6\u3001\u4EC7\u89C6\u540C\u6027\
        \u604B\u3001\u4EC7\u89C6\u53D8\u6027\u8005\u3001\u5F02\u80FD\u8005\u3001\u4EC7\
        \u5916\u5FC3\u7406\u6216\u79CD\u59D3\u6B67\u89C6\u3002\",\"hint\":\"\u4E25\
        \u7981\u53D8\u6027\u4EC7\u89C6\u884C\u4E3A\uFF0C\u5982\u6545\u610F\u8BEF\u7528\
        \u6027\u522B\u548C\u6B7B\u540D\u3002\u4E25\u7981\u5BA3\u4F20 \u201C\u8F6C\u6362\
        \u7597\u6CD5\u201D\u3002\u5141\u8BB8\u6279\u8BC4\u653F\u5E9C\u548C\u5B97\u6559\
        \uFF0C\u9664\u975E\u88AB\u7528\u4F5C\u6B67\u89C6\u7684\u4EE3\u540D\u8BCD\u3002\
        \"},\"zh-TW\":{\"text\":\"\u7981\u6B62\u7A2E\u65CF\u4E3B\u7FA9\u3001\u6027\
        \u5225\u4E3B\u7FA9\u3001\u6050\u540C\u4E3B\u7FA9\u3001\u6050\u8B8A\u6027\u4E3B\
        \u7FA9\u3001\u80FD\u529B\u4E3B\u7FA9\u3001\u4EC7\u5916\u4E3B\u7FA9\u6216\u7A2E\
        \u6027\u4E3B\u7FA9\u3002\",\"hint\":\"\u56B4\u7981\u8B8A\u6027\u4EC7\u8996\
        \u884C\u70BA\uFF0C\u4F8B\u5982\u6545\u610F\u8AA4\u7528\u6027\u5225\u548C\u66B1\
        \u7A31\u3002\u56B4\u7981\u5BA3\u50B3\u300C\u626D\u8F49\u6CBB\u7642\u300D\u3002\
        \u5141\u8A31\u6279\u8A55\u653F\u5E9C\u548C\u5B97\u6559\uFF0C\u9664\u975E\u88AB\
        \u7528\u4F86\u4EE3\u8868\u6B67\u8996\u3002\"}}},{\"id\":\"3\",\"text\":\"\
        No incitement of violence or promotion of violent ideologies\",\"hint\":\"\
        Calling for people or groups to be assassinated, murdered, or attacked physically\
        \ is strictly prohibited. Support for violent groups or events is prohibited.\"\
        ,\"translations\":{\"de\":{\"text\":\"Keine Anstiftung zu Gewalt oder F\xF6\
        rderung gewaltt\xE4tiger Ideologien.\",\"hint\":\"Der Aufruf zum Mord oder\
        \ k\xF6rperlichen Attacken auf Personen oder Gruppen ist strengstens verboten.\
        \ Die Unterst\xFCtzung gewaltt\xE4tiger Gruppen oder Veranstaltungen ist verboten.\"\
        },\"es\":{\"text\":\"Prohibida la incitaci\xF3n a la violencia o la promoci\xF3\
        n de ideolog\xEDas violentas.\",\"hint\":\"Est\xE1 estrictamente prohibido\
        \ hacer llamamientos para que se asesine, mate o agreda f\xEDsicamente a personas\
        \ o grupos. Est\xE1 prohibido apoyar a grupos o acontecimientos violentos.\"\
        },\"fr\":{\"text\":\"Pas d\u2019incitation \xE0 la violence ou de promotion\
        \ d\u2019id\xE9ologies violentes.\",\"hint\":\"L\u2019appel au meutre, \xE0\
        \ la violence ou \xE0 l\u2019action physique envers des personnes ou des groupes\
        \ de personnes est strictement interdit. Le soutien \xE0 des groupes ou \xE9\
        v\xE8nements violents est interdit.\"},\"nl\":{\"text\":\"Niet aanzetten tot\
        \ geweld of verspreiden van gewelddadige ideologie\xEBn.\",\"hint\":\"Mensen\
        \ of groepen aanzetten tot moord, aanslagen of fysieke aanvallen is ten strengste\
        \ verboden. Steun voor gewelddadige groeperingen of evenementen is verboden.\"\
        },\"ru\":{\"text\":\"\u0417\u0430\u043F\u0440\u0435\u0449\u0430\u0435\u0442\
        \u0441\u044F \u043F\u043E\u0434\u0441\u0442\u0440\u0435\u043A\u0430\u0442\u0435\
        \u043B\u044C\u0441\u0442\u0432\u043E \u043A \u0436\u0435\u0441\u0442\u043E\
        \u043A\u043E\u0441\u0442\u0438 \u0438\u043B\u0438 \u043F\u0440\u043E\u0434\
        \u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u0436\u0435\u0441\u0442\u043E\u043A\
        \u0438\u0445 \u0438\u0434\u0435\u043E\u043B\u043E\u0433\u0438\u0439.\",\"\
        hint\":\"\u041F\u0440\u0438\u0437\u044B\u0432\u044B \u043A \u043F\u043E\u043A\
        \u0443\u0448\u0435\u043D\u0438\u044F\u043C, \u0443\u0431\u0438\u0439\u0441\
        \u0442\u0432\u0430\u043C \u0438 \u0444\u0438\u0437\u0438\u0447\u0435\u0441\
        \u043A\u0438\u043C \u0430\u0442\u0430\u043A\u0430\u043C \u043D\u0430 \u043B\
        \u044E\u0434\u0435\u0439 \u0438\u043B\u0438 \u0433\u0440\u0443\u043F\u043F\
        \u044B \u043B\u044E\u0434\u0435\u0439 \u0441\u0442\u0440\u043E\u0433\u043E\
        \ \u0437\u0430\u043F\u0440\u0435\u0449\u0435\u043D\u044B. \u041F\u043E\u0434\
        \u0434\u0435\u0440\u0436\u043A\u0430 \u0436\u0435\u0441\u0442\u043E\u043A\u0438\
        \u0445 \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432 \u0438\u043B\
        \u0438 \u0441\u043E\u0431\u044B\u0442\u0438\u0439 \u0437\u0430\u043F\u0440\
        \u0435\u0449\u0435\u043D\u0430.\"},\"zh-CN\":{\"text\":\"\u4E0D\u5F97\u717D\
        \u52A8\u66B4\u529B\u6216\u5BA3\u626C\u66B4\u529B\u610F\u8BC6\u5F62\u6001\"\
        ,\"hint\":\"\u4E25\u7981\u547C\u5401\u6697\u6740\u3001\u8C0B\u6740\u6216\u4EBA\
        \u8EAB\u653B\u51FB\u4ED6\u4EBA\u6216\u56E2\u4F53\u3002\u7981\u6B62\u652F\u6301\
        \u66B4\u529B\u56E2\u4F53\u6216\u4E8B\u4EF6\u3002\"},\"zh-TW\":{\"text\":\"\
        \u56B4\u7981\u717D\u52D5\u66B4\u529B\u6216\u5BA3\u63DA\u66B4\u529B\u610F\u8B58\
        \u5F62\u614B\",\"hint\":\"\u56B4\u7981\u547C\u7C72\u6697\u6BBA\u3001\u8B00\
        \u6BBA\u6216\u4EBA\u8EAB\u653B\u64CA\u4ED6\u4EBA\u6216\u5718\u9AD4\u3002\u56B4\
        \u7981\u652F\u6301\u66B4\u529B\u5718\u9AD4\u6216\u4E8B\u4EF6\u3002\"}}},{\"\
        id\":\"4\",\"text\":\"No harassment, block evasion, dogpiling, or doxxing\
        \ of others\",\"hint\":\"Repeat attempts to communicate with users who have\
        \ blocked you or creation of accounts solely to harass or insult individuals\
        \ is strictly prohibited. Coordinated activity to attack other users is prohibited.\
        \ Posting of private personal information about others is prohibited.\",\"\
        translations\":{\"de\":{\"text\":\"Keine Bel\xE4stigungen, Umgehung von Blockierungen,\
        \ Dogpiling oder Doxxing.\",\"hint\":\"Wiederholte Kommunikationsversuche\
        \ mit Profilen, die dich blockiert haben, oder die Erstellung neuer Konten,\
        \ die ausschlie\xDFlich dazu dienen, andere zu bel\xE4stigen oder zu beleidigen,\
        \ sind strengstens verboten. Koordinierte Angriffe auf andere Profile sind\
        \ verboten. Die Ver\xF6ffentlichung von privaten und pers\xF6nlichen Informationen\
        \ anderer ist verboten.\"},\"es\":{\"text\":\"No acosar, evadir bloqueos,\
        \ \\\"dogpiling\\\" (abuso en l\xEDnea por grupos de acosadores) o doxeo de\
        \ otros.\",\"hint\":\"Est\xE1 estrictamente prohibido intentar comunicarse\
        \ repetidamente con usuarios que te hayan bloqueado o crear cuentas con el\
        \ \xFAnico fin de acosar o insultar a otras personas. Queda prohibida la actividad\
        \ coordinada para atacar a otros usuarios. Est\xE1 prohibido publicar informaci\xF3\
        n personal privada sobre otras personas.\"},\"fr\":{\"text\":\"Pas de harc\xE8\
        lement, d\u2019esquive de blocage, de \u201Cdogpiling\u201D, ou de divulgation\
        \ de donn\xE9es personnelles d\u2019autrui.\",\"hint\":\"Les tentatives r\xE9\
        p\xE9t\xE9es de communiquer avec des utilisateur\xB7ices qui vont ont bloqu\xE9\
        \ ainsi que la cr\xE9ation de comptes pour harceler ou insulter autrui sont\
        \ strictement interdites. Les attaques coordonn\xE9es contre autrui sont interdites.\
        \ La publication de donn\xE9es personnelles d\u2019autrui est interdite.\"\
        },\"nl\":{\"text\":\"Geen intimidatie, omzeilen van blokkades, groepsaanvallen\
        \ of het verspreiden van priv\xE9gegevens van anderen.\",\"hint\":\"Herhaalde\
        \ pogingen tot communiceren met gebruikers die je hebben geblokkeerd, of het\
        \ maken van accounts enkel om personen te intimideren of beledigen is ten\
        \ strengste verboden. Geco\xF6rdineerde activiteit om andere gebruikers aan\
        \ te vallen is verboden. Het plaatsen van priv\xE9-gegevens van anderen is\
        \ verboden.\"},\"ru\":{\"text\":\"\u0417\u0430\u043F\u0440\u0435\u0449\u0430\
        \u0435\u0442\u0441\u044F \u0442\u0440\u0430\u0432\u043B\u044F, \u0438\u0437\
        \u0431\u0435\u0433\u0430\u043D\u0438\u0435 \u0431\u043B\u043E\u043A\u0438\u0440\
        \u043E\u0432\u043E\u043A, \u043D\u0430\u0431\u0435\u0433\u0438 \u0438 \u0440\
        \u0430\u0437\u0433\u043B\u0430\u0448\u0435\u043D\u0438\u0435 \u043B\u0438\u0447\
        \u043D\u043E\u0439 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u0438\
        \ \u0434\u0440\u0443\u0433\u0438\u0445 \u043B\u0438\u0446.\",\"hint\":\"\u041F\
        \u043E\u0432\u0442\u043E\u0440\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u043F\
        \u043E\u043F\u044B\u0442\u043A\u0438 \u0432\u0437\u0430\u0438\u043C\u043E\u0434\
        \u0435\u0439\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u0441 \u043F\
        \u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044F\u043C\u0438\
        , \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432\u0430\u0441 \u0437\u0430\
        \u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u0430\u043B\u0438, \u0438\
        \ \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u0435 \u0443\u0447\u0451\u0442\
        \u043D\u044B\u0445 \u0437\u0430\u043F\u0438\u0441\u0435\u0439 \u0438\u0441\
        \u043A\u043B\u044E\u0447\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0440\u0430\
        \u0434\u0438 \u0442\u0440\u0430\u0432\u043B\u0438 \u0438\u043B\u0438 \u043E\
        \u0441\u043A\u043E\u0440\u0431\u043B\u0435\u043D\u0438\u0439, \u0441\u0442\
        \u0440\u043E\u0433\u043E \u0437\u0430\u043F\u0440\u0435\u0449\u0435\u043D\u044B\
        . \u0421\u043A\u043E\u043E\u0440\u0434\u0438\u043D\u0438\u0440\u043E\u0432\
        \u0430\u043D\u043D\u0430\u044F \u0430\u043A\u0442\u0438\u0432\u043D\u043E\u0441\
        \u0442\u044C \u0441 \u0446\u0435\u043B\u044C\u044E \u0430\u0442\u0430\u043A\
        \u0438 \u043D\u0430 \u0434\u0440\u0443\u0433\u0438\u0445 \u043F\u043E\u043B\
        \u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u0435\u0439 \u0437\u0430\u043F\
        \u0440\u0435\u0449\u0435\u043D\u0430. \u041F\u0443\u0431\u043B\u0438\u043A\
        \u0430\u0446\u0438\u044F \u043B\u0438\u0447\u043D\u043E\u0439 \u0438\u043D\
        \u0444\u043E\u0440\u043C\u0430\u0446\u0438\u0438 \u0434\u0440\u0443\u0433\u0438\
        \u0445 \u043B\u0438\u0446 \u0437\u0430\u043F\u0440\u0435\u0449\u0435\u043D\
        \u0430.\"},\"zh-CN\":{\"text\":\"\u4E0D\u5F97\u9A9A\u6270\u3001\u56DE\u907F\
        \u5C01\u7981\u3001\u8BFD\u8C24\u6216\u653B\u51FB\u4ED6\u4EBA\",\"hint\":\"\
        \u4E25\u7981\u91CD\u590D\u5C1D\u8BD5\u4E0E\u5DF2\u5C01\u7981\u60A8\u7684\u7528\
        \u6237\u4EA4\u6D41\uFF0C\u6216\u4EC5\u4E3A\u9A9A\u6270\u6216\u4FAE\u8FB1\u4ED6\
