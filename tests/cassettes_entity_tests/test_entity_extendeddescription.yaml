      string: '{"updated_at": "2026-08-07T14:46:52Z", "content": "<p>The mastodon.social
        server is the original instance of the Mastodon open source software (OSS),
        created and maintained by Mastodon GmbH. Our team runs this server to provide
        a safe landing place for anyone, especially for newcomers to the social web,
        and as a reference implementation of the Mastodon software. For these reasons,
        we take a strong stance against content and speech that does harm.</p>\n\n<p>If
        this doesn\u2019t sound like the right place for you, we encourage you to
        explore other Mastodon servers by visiting our <a href=\"https://joinmastodon.org/servers\">Server
        Directory</a>. If you already created an account on mastodon.social and want
        to move to a different instance, you can learn how to do so <a href=\"https://docs.joinmastodon.org/user/moving/#migration\">here</a>.</p>\n\n<h2>Our
        community standards</h2>\n\n<p>Signing up for an account on this server means
        you agree to follow the server rules below, and our extended community standards
        <a href=\"https://help.joinmastodon.org/collection/8-standards-policies\">here</a>.
        Our <a href=\"https://help.joinmastodon.org/\">Help Centre</a> has more information
        about <a href=\"https://help.joinmastodon.org/collection/1-support-tutorials\">using
        Mastodon</a> and <a href=\"https://help.joinmastodon.org/article/13-fediquette-community-etiquette-guide\">our
        community</a>.</p>\n\n<p>When accounts or content on servers we moderate violates
        our server rules and standards our enforcement is proportional, context-aware,
        and designed to educate before punishing when possible. When accounts or content
        on servers we moderate violates the law, we act swiftly to minimise harm.
        You can learn more about how our moderation team makes decisions, as well
        as how to appeal our decisions, on our <a href=\"https://help.joinmastodon.org/article/20-moderation-decisions-and-appeals\">Help
        Centre</a>. </p>\n\n<h2>Contact us</h2>\n\n<p><strong>Contact for Users:</strong>
        To get in touch with the team that manages this server you can email us. Please
        mind that the <a href=\"mailto:staff@mastodon.social\">staff@mastodon.social</a>
        e-mail is for inquiries related to the operation of the mastodon.social server
        specifically. Find more information here: <a href=\"https://help.joinmastodon.org/article/17-point-of-contact-for-users\">Contact
        for Users</a>.</p>\n\n<p>Additional contact points:</p>\n\n<ul>\n<li>For GDPR
        or DMCA inquiries, please contact <a href=\"mailto:legal@mastodon.social\">legal@mastodon.social</a>.</li>\n<li>For
        moderation appeals, please contact <a href=\"mailto:moderation@mastodon.social\">moderation@mastodon.social</a>.
        </li>\n</ul>\n\n<p><strong>Contact for Authorities:</strong> If you are an
        EU Member State authority, the EU Commission or the EU Board for digital services,
        you may submit an order or communicate with us in relation to the DSA via
        <a href=\"mailto:authorities@joinmastodon.org\">authorities@joinmastodon.org</a>.
        Find more information here: <a href=\"https://help.joinmastodon.org/article/16-point-of-contact-for-authorities\">Contact
        for Authorities</a>.</p>\n\n<p>Additional contact points: </p>\n\n<ul>\n<li>For
        data or takedown requests by Law Enforcement, please review our <a href=\"https://mastodon.social/privacy-policy\">Privacy
        Policy</a> and contact <a href=\"mailto:legal@mastodon.social\">legal@mastodon.social</a>.
        </li>\n</ul>\n\n<p>If your account is not hosted by mastodon.social, there
        are certain help requests and appeals we won\u2019t be able to assist with.
        If you aren\u2019t sure, please get in touch at <a href=\"mailto:hello@joinmastodon.org\">hello@joinmastodon.org</a>
        and we\u2019ll help how we can.</p>\n\n<p>If you\u2019d like to speak with
        someone at Mastodon for any reason not related to the operation of the server,
        <a href=\"https://joinmastodon.org/about#contact\">visit our website</a> to
        find the <a href=\"https://joinmastodon.org/about#contact\">right contact</a>.</p>\n\n<h2>Funding</h2>\n\n<p>This
        server is funded by our generous donors. Beyond the operation of this server,
        donations directly support the ongoing development of the platform and ensures
        that Mastodon remains an independent, community-driven alternative to corporate
        social media. By contributing, you&#39;re not just supporting a technology
        project, but investing in a vision of the internet where users have more control,
        privacy, and meaningful connections.</p>\n\n<p>Visit our website to see a
        list of our <a href=\"https://joinmastodon.org/sponsors#supported_by\">sponsors</a>
        and to <a href=\"https://joinmastodon.org/sponsors#donate\">donate</a>.</p>\n\n<h2>Legal
        notice</h2>\n\n<p><strong>Company Name</strong>: Mastodon GmbH</p>\n\n<p><strong>Address</strong>:</p>\n\n<p>M\u00fchlenstra\u00dfe
        8a<br>\n14167 Berlin<br>\nGermany</p>\n\n<p><strong>Contact</strong>: hello@joinmastodon.org</p>\n\n<p><strong>Commercial
        Register</strong>: HRB 230086 B (Charlottenburg Local Court)</p>\n\n<p><strong>VAT
        ID</strong>: DE344258260</p>\n\n<p><strong>Authorized Representatives</strong>:</p>\n\n<p>Felix
        Hlatky (Managing Director)<br>\nDr. Marius Rothermund (Managing Director)  </p>\n"}'
